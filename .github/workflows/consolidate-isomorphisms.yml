name: One-time consolidate isomorphisms repository

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/consolidate-isomorphisms.yml"

permissions:
  contents: read

jobs:
  consolidate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      - name: Transfer repository and import software history
        shell: bash
        run: |
          set -euo pipefail

          old_repo="one-room-schoolhouse/isomorphisms"
          target_repo="isomorphisms/isomorphisms"
          source_repo="isomorphisms/software"

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "PROJECTS_TOKEN is not configured." >&2
            exit 1
          fi

          tumblr_before="$(gh api "repos/${old_repo}/branches/Tumblr" --jq '.commit.sha')"
          board_before="$(gh api "repos/${old_repo}/branches/branch-project-board-sync" --jq '.commit.sha')"

          gh api --method POST "repos/${old_repo}/transfer" -f new_owner=isomorphisms >/tmp/transfer.json

          target_ready=0
          for _ in $(seq 1 60); do
            if gh api "repos/${target_repo}" >/dev/null 2>&1; then
              target_ready=1
              break
            fi
            sleep 2
          done
          if [[ "${target_ready}" != 1 ]]; then
            echo "Transferred repository did not become available as ${target_repo}." >&2
            exit 1
          fi

          git clone --bare "https://github.com/${source_repo}.git" /tmp/software.git
          cd /tmp/software.git

          migration_sha="$(git rev-parse refs/heads/migration/isomorphisms-root)"
          git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${target_repo}.git"

          git push destination 'refs/heads/*:refs/heads/*'

          if git for-each-ref --format='%(refname)' refs/tags/ | grep -q .; then
            git push destination 'refs/tags/*:refs/tags/*'
          fi

          git push destination refs/heads/migration/isomorphisms-root:refs/heads/main

          main_after="$(gh api "repos/${target_repo}/git/ref/heads/main" --jq '.object.sha')"
          tumblr_after="$(gh api "repos/${target_repo}/branches/Tumblr" --jq '.commit.sha')"
          board_after="$(gh api "repos/${target_repo}/branches/branch-project-board-sync" --jq '.commit.sha')"

          [[ "${main_after}" == "${migration_sha}" ]]
          [[ "${tumblr_after}" == "${tumblr_before}" ]]
          [[ "${board_after}" == "${board_before}" ]]

          while IFS= read -r ref; do
            branch="${ref#refs/heads/}"
            source_sha="$(git rev-parse "${ref}")"
            target_sha="$(gh api "repos/${target_repo}/git/ref/heads/${branch}" --jq '.object.sha')"
            if [[ "${source_sha}" != "${target_sha}" ]]; then
              echo "Branch verification failed: ${branch}" >&2
              exit 1
            fi
          done < <(git for-each-ref --format='%(refname)' refs/heads/)

          gh api --method PATCH "repos/${target_repo}" -f default_branch=main >/dev/null

          gh api --method DELETE "repos/${target_repo}/git/refs/heads/master" >/dev/null 2>&1 || true
          gh api --method DELETE "repos/${target_repo}/git/refs/heads/zoneedit-mobile" >/dev/null 2>&1 || true
          gh api --method DELETE "repos/${target_repo}/git/refs/heads/my" >/dev/null 2>&1 || true
          gh api --method DELETE "repos/${target_repo}/git/refs/heads/migration/isomorphisms-root" >/dev/null 2>&1 || true

          gh api --method PATCH "repos/${source_repo}" -F archived=true >/dev/null

          echo "Migration complete."
          echo "main=${main_after}"
          echo "Tumblr=${tumblr_after}"
          echo "branch-project-board-sync=${board_after}"
